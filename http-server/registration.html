<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 py-10 overflow-y-scroll">
    <div class="flex flex-col border-2 mx-auto border-gray-900 rounded rounded-lg shadow-gray-700 shadow-lg justify-center align-center w-[40%] h-[40%] py-10">
        <div class="text-2xl font-bold text-gray-900 py-10 mx-auto">Registration Form </div>
        <div class=" flex flex-col">
            <form class="flex flex-col w-full" id="form-id">
                <div class="px-10 py-4 flex items-center">
                    <label for="name" class="flex-shrink-0 w-20">Name</label>
                    <input type="text" id="name" name="name" class="rounded rounded-lg px-2 py-2 w-[60%]">
                </div>
                <div class="px-10 py-4 flex items-center">
                    <label for="email" class="flex-shrink-0 w-20">Email</label>
                    <input type="email" id="email" name="email" class="rounded rounded-lg px-2 py-2 w-[60%]">
                </div>
                <div class="px-10 py-4 flex items-center">
                    <label for="password" class="flex-shrink-0 w-20">Password</label>
                    <input type="password" id="password" name="password" class="rounded rounded-lg px-2 py-2 w-[60%]">
                </div>
                <div class="px-10 py-4 flex items-center">
                    <label for="dob" class="flex-shrink-0 w-20">Date of Birth</label>
                    <input type="date" id="dob" name="dob" class="rounded rounded-lg px-2 py-2 w-[60%] text-red-600">
                </div>
                <div class="px-10 py-4 flex items-center">
                    <input type="checkbox" id="acceptTerms" name="acceptTerms" class="flex-shrink-0 w-5 px-10">
                    <label for="acceptTerms">Accept Terms & Conditions</label>
                </div>
                <div class="w-full px-10">
                    <div class="flex justify-center align-center rounded-lg border-green-600 shadow-gray-700 shadow-lg bg-green-600 w-[15%] p-2">
                        <button type="submit" id="your-id">Submit</button>
                    </div>
                </div>
            </form>
            
    </div>
    </div>
    <div class="py-10 pb-10">
        <div class="flex flex-col mx-auto border-2 border-gray-900 rounded rounded-lg shadow-gray-700 shadow-lg w-[50%]">
            <div class="text-2xl text-gray-900 font-bold mx-auto py-7">Entries</div>
            <div >
                <table id="table" class="w-full">
                    <thead>
                        <tr>
                            <th class="w-1/5">Name</th>
                            <th class="w-1/5">Email</th>
                            <th class="w-1/5">Password</th>
                            <th class="w-1/5">Date of Birth</th>
                            <th class="w-1/5">Accepted Terms?</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="px-10"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
